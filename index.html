<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mesa Solidária</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/telaLogin.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="icon" type="image/png" href="img/logo.png" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="conteiner-navbar">
        <div class="area-logo">
          <a href="inicio.html">
            <img
              src="img/MESA SOLIDARIA - LOGO PRINCIPAL.svg"
              alt="Logo Mesa Solidária"
              class="imagem-logo"
            />
          </a>
        </div>

        <nav class="menu">
          <a href="index.html" class="item-menu">Início</a>
          <a href="sobre.html" class="item-menu">Sobre</a>
          <a href="comoFunciona.html" class="item-menu">Como funciona</a>

          <a href="familia.html" class="item-menu">Famílias</a>
          <a href="doador.html" class="item-menu">Doador</a>
          <a href="voluntario.html" class="item-menu">Voluntário</a>
          <a href="empresaParceira.html" class="item-menu"
            >Empresas parceiras</a
          >

          <a href="impacto.html" class="item-menu">Impacto</a>
          <a href="faq.html" class="item-menu">FAQ</a>
          <a href="contato.html" class="item-menu">Contato</a>
        </nav>

       <div class="area-botao">
      <a class="botao-entrar" href="login.html">Entrar</a>

      <button class="botao-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
      </button>
    </div>
  </div>
</header>

    <div class="pagina-login">
      <section class="coluna-perfis">
        <h1 class="titulo-principal">Acesse o Mesa Solidária</h1>
        <p class="texto-introducao">
          Escolha como você quer entrar na plataforma e faça login com seus
          dados.
        </p>

        <div class="lista-perfis">
          <button class="cartao-perfil" type="button" data-tipo="beneficiario">
            <div class="avatar-perfil">
              <img src="img/logo_beneficiario.png" alt="Beneficiário" />
            </div>
            <div class="conteudo-perfil">
              <h2 class="titulo-perfil">Beneficiário</h2>
              <p class="descricao-perfil">Para ver e acompanhar doações.</p>
            </div>
          </button>

          <button class="cartao-perfil" type="button" data-tipo="voluntario">
            <div class="avatar-perfil">
              <img src="img/logo_voluntario.png" alt="Voluntário" />
            </div>
            <div class="conteudo-perfil">
              <h2 class="titulo-perfil">Voluntário</h2>
              <p class="descricao-perfil">Para participar e gerar impacto.</p>
            </div>
          </button>

          <button class="cartao-perfil" type="button" data-tipo="doador">
            <div class="avatar-perfil">
              <img src="img/logo_doador.png" alt="Doador" />
            </div>
            <div class="conteudo-perfil">
              <h2 class="titulo-perfil">Doador</h2>
              <p class="descricao-perfil">
                Para contribuir e fazer a diferença.
              </p>
            </div>
          </button>

          <button
            class="cartao-perfil"
            type="button"
            data-tipo="ponto_de_coleta"
          >
            <div class="avatar-perfil">
              <img src="img/logo_ponto_de_coleta.png" alt="Ponto de coleta" />
            </div>
            <div class="conteudo-perfil">
              <h2 class="titulo-perfil">Ponto de Coleta</h2>
              <p class="descricao-perfil">Onde as doações são organizadas.</p>
            </div>
          </button>
        </div>
      </section>

      <section class="coluna-formulario">
        <div class="cartao-login">
          <h2 class="titulo-login">Entre na sua conta</h2>

          <form class="formulario-login" action="#" novalidate>
            <input
              type="hidden"
              name="tipo_usuario"
              id="tipo-usuario"
              value=""
            />

            <div class="campo-formulario">
              <label class="rotulo-campo" for="entrada-identificador">
                Digite seu E-mail ou CPF:
              </label>
              <div class="campo-com-icone">
                <span class="icone-campo">@</span>
                <input
                  type="text"
                  id="entrada-identificador"
                  name="identificador"
                  class="entrada-formulario"
                  placeholder="E-mail ou CPF"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="campo-formulario">
              <label class="rotulo-campo" for="entrada-senha">
                Digite sua senha:
              </label>
              <div class="campo-com-icone">
                <span class="icone-campo">🔒</span>
                <input
                  type="password"
                  id="entrada-senha"
                  name="senha"
                  class="entrada-formulario"
                  placeholder="Senha"
                  autocomplete="current-password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="botao-entrar">Entrar</button>

            <div class="acoes-login">
              <a href="#" class="link-login">Esqueceu a senha?</a>
              <span class="separador-links">•</span>
              <a href="#" class="link-login" id="link-cadastro">Cadastre-se</a>
            </div>
          </form>
        </div>
      </section>
    </div>

    <div id="area-footer"></div>

    <script src="js/telaLogin.js"></script>
  </body>
</html>
